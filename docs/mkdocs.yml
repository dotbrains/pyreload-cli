site_name: Pyreload Documentation
site_description: Automatically restart Python applications when file changes are detected
site_author: dotbrains
site_url: https://dotbrains.github.io/pyreload-cli

repo_name: dotbrains/pyreload-cli
repo_url: https://github.com/dotbrains/pyreload-cli
edit_uri: edit/main/docs/src/

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dotbrains/pyreload-cli
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyreload-cli/

docs_dir: src
site_dir: ../site

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Basic Usage: getting-started/basic-usage.md
  - User Guide:
    - Watch Patterns: user-guide/watch-patterns.md
    - Ignore Patterns: user-guide/ignore-patterns.md
    - Polling Mode: user-guide/polling-mode.md
    - Config Files: user-guide/config-files.md
    - Interactive Commands: user-guide/commands.md
  - Advanced:
    - Exec Mode: advanced/exec-mode.md
    - Clean Mode: advanced/clean-mode.md
    - Troubleshooting: advanced/troubleshooting.md
  - Use Cases:
    - Docker Development: use-cases/docker.md
    - Vagrant Development: use-cases/vagrant.md
  - API Reference:
    - CLI Reference: api/cli-reference.md
    - Config Reference: api/config-reference.md
